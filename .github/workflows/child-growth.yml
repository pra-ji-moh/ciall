# The child, growing on its own in the cloud: every hour, whether or not any
# laptop is on. It builds itself, plays the practice worlds and every public
# ARC-AGI-3 game (downloaded by ARC Prize's toolkit on the runner), and commits
# what it settled (child/) back, so the next hour starts where this one stood.
name: child growth

on:
  schedule:
    - cron: "17 * * * *"      # every hour, at 17 minutes past
  workflow_dispatch: {}        # and whenever started by hand

permissions:
  contents: write              # to commit the child's mind back

concurrency:
  group: child-growth          # never two stretches at once: one mind
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ARC Prize toolkit, and the same compiler the child is checked with at home
        run: |
          pip install arc-agi ziglang numpy
          # numpy's own normals on this machine, for the check that the child's match them
          echo "NPRAND_NUMPY_CRC=$(python -c 'import numpy as np, zlib; print(hex(zlib.crc32(np.random.default_rng(0).standard_normal(1000000).astype("<f8").tobytes())))')" >> "$GITHUB_ENV"
          # a wrapper, so every script that says $CC gets zig, exactly as on the laptop
          mkdir -p "$HOME/bin"
          echo '#!/bin/sh' > "$HOME/bin/zigcc"
          echo 'exec python -m ziglang cc "$@"' >> "$HOME/bin/zigcc"
          chmod +x "$HOME/bin/zigcc"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "CC=zigcc" >> "$GITHUB_ENV"

      # its bookshelf: the stories it has fetched are kept from hour to hour, so each
      # hour it reads more than the last instead of starting again at the same 2000
      - name: its bookshelf, kept between hours
        uses: actions/cache@v4
        with:
          path: books
          key: books-${{ github.run_id }}
          restore-keys: books-

      - name: build the child
        run: sh child/build_child.sh

      # its own checks, run where it can be seen which fail: the self-writer refuses
      # to touch a source whose checks fail, and here some do that pass at home
      - name: its checks, on this machine
        continue-on-error: true
        run: bash build_c.sh 2>&1 | grep -E "FAIL|passed, " -A4 | head -60

      - name: one stretch, and one attempt to rewrite itself
        run: PYTHON=python sh child/grow_hourly.sh

      - name: keep what it settled
        if: always()             # what it played is kept even if the attempt on itself went wrong
        run: |
          git config user.name "ciall-child"
          git config user.email "ciall-child@users.noreply.github.com"
          git add child/ certifiable-c/smarsh_self.h
          if git diff --cached --quiet; then
            echo "nothing new settled"
          else
            git commit -m "child: $(tail -n 1 child/arc_progress.txt | cut -c1-120)"
            git pull --rebase --autostash || true
            git push
          fi
